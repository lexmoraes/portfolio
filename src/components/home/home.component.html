<section
  id="hero"
  class="relative py-28 overflow-hidden bg-portfolio-bg text-portfolio-text transition-colors duration-500"
>
  <div
    class="max-w-6xl mx-auto px-6 w-full grid grid-cols-1 md:grid-cols-2 gap-12 items-center relative z-10"
  >
    <div class="flex flex-col items-start text-left max-w-xl">
      <span class="badge-pill">
        <span class="badge-dot"></span>
        Disponível para novos desafios
      </span>

      <h1
        class="hero-title mt-6 text-5xl md:text-7xl font-extrabold tracking-tight text-portfolio-heading leading-[1.05] transition-colors duration-500"
      >
        Alexsandro Moraes
      </h1>

      <p
        class="mt-6 text-base md:text-lg text-portfolio-text/90 font-normal leading-relaxed transition-colors duration-500"
      >
        Desenvolvedor de Software focado em criar aplicações escaláveis, performáticas e com
        experiências de usabilidade e visuais de alto impacto.
      </p>

      <div class="mt-10 flex flex-col sm:flex-row gap-3 w-full">
        <a href="#projects" class="btn btn-primary w-full sm:w-auto"> Ver Projetos </a>

        <app-resume class="w-full sm:w-auto block flex-shrink-0"></app-resume>

        <a href="#about" class="btn btn-outline w-full sm:w-auto"> Entrar em contato </a>
      </div>
    </div>

    <div class="flex justify-center items-center relative h-[420px] md:h-[500px]">
      <div
        class="absolute w-[260px] h-[260px] md:w-[340px] md:h-[340px] bg-portfolio-primary/25 blur-[90px] rounded-full transition-all duration-500"
      ></div>

      <img
        [src]="
          themeService.currentTheme() === 'dark'
            ? 'assets/images/profile/profile-dark.jpeg'
            : 'assets/images/profile/profile-light.jpg'
        "
        alt="Alexsandro Moraes"
        class="relative z-10 w-[280px] md:w-[360px] h-[340px] md:h-[440px] object-cover rounded-2xl shadow-2xl border border-portfolio-border/40 transition-colors duration-500"
      />
    </div>
  </div>
</section>

<div id="projects">
  <app-project-list></app-project-list>
</div>

<div id="about">
  <app-about></app-about>
</div>
