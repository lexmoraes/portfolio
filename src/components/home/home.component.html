<section id="hero" class="relative py-28 overflow-hidden text-portfolio-text transition-colors duration-500">

  <div class="max-w-6xl mx-auto px-6 w-full grid grid-cols-1 md:grid-cols-2 gap-12 items-center relative z-10">
    <div class="flex flex-col items-start text-left max-w-xl animate-fade-up">
      <span class="text-portfolio-primary font-mono text-xs tracking-widest block mb-4 uppercase font-semibold">
        Disponível para novos desafios
      </span>

      <h1 class="hero-title text-5xl md:text-6xl font-extrabold tracking-tight text-portfolio-heading leading-tight transition-colors duration-500">
        Alexsandro Moraes
      </h1>

      <p class="mt-6 text-base md:text-lg text-portfolio-text/90 leading-relaxed transition-colors duration-500">
        Desenvolvedor de Software focado em criar aplicações escaláveis, performáticas e com experiências de usabilidade e visuais de alto impacto.
      </p>

      <div class="mt-10 flex flex-col sm:flex-row gap-4 w-full">

        <a href="#projects" mat-raised-button
           class="!bg-portfolio-primary !text-portfolio-bg hover:opacity-90 !px-6 !rounded-xl !font-medium !shadow-md transition-all duration-300 flex items-center justify-center !h-12 w-full sm:w-auto flex-shrink-0">
          Ver Projetos
        </a>

        <app-resume class="w-full sm:w-auto block flex-shrink-0"></app-resume>

        <a href="#contato"
           class="px-6 rounded-xl border border-portfolio-primary bg-portfolio-primary/10 text-portfolio-primary hover:bg-portfolio-primary/20 font-medium shadow-sm transition-all duration-300 flex items-center justify-center gap-2 cursor-pointer !h-12 w-full sm:w-auto flex-shrink-0">
          Entrar em contato
        </a>

      </div>
    </div>

    <div class="flex justify-center items-center relative h-[340px] md:h-[550px]">
      <div aria-hidden="true" class="absolute w-[300px] h-[300px] md:w-[420px] md:h-[420px] bg-portfolio-primary opacity-40 animate-pulse-slow
          rounded-[42%_58%_70%_30%_/_45%_45%_55%_55%] transition-all duration-500">
      </div>

      <div class="relative z-10 w-[260px] h-[260px] md:w-[380px] md:h-[380px] overflow-hidden rounded-[42%_58%_70%_30%_/_45%_45%_55%_55%] border border-portfolio-border/30 drop-shadow-[0_10px_20px_rgba(44,37,35,0.15)]">
        <img [ngSrc]="profileImage()"
             fill
             priority
             sizes="(min-width: 768px) 380px, 260px"
             alt="Foto de Alexsandro Moraes"
             class="object-cover" />
      </div>
    </div>
  </div>
</section>

<div id="projects">
  <app-project-list></app-project-list>
</div>

<div id="skills">
  <app-skills></app-skills>
</div>

<div id="about">
  <app-about></app-about>
</div>

<div id="contato">
  <app-contact></app-contact>
</div>
