<div
  class="relative min-h-screen overflow-hidden bg-portfolio-bg text-portfolio-text transition-colors duration-500"
>
  <div
    class="absolute top-[-200px] left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-portfolio-primary/[0.06] blur-3xl rounded-full pointer-events-none transition-colors duration-500"
  ></div>

  <div class="flex flex-col min-h-screen relative z-10">
    <header
      class="sticky top-0 z-50 border-b border-portfolio-border/20 backdrop-blur-md bg-portfolio-bg/80 transition-colors duration-500 [transform:translateZ(0)] [will-change:transform]"
    >
      <nav class="max-w-6xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between gap-2">
        <a
          href="#hero"
          class="text-lg sm:text-xl font-bold tracking-tight text-portfolio-heading flex-shrink-0"
        >
          Alexsandro<span class="text-portfolio-primary">.</span>
        </a>

        <div class="flex items-center gap-2.5 sm:gap-6 md:gap-8 text-xs sm:text-sm font-medium">
          <a
            href="#hero"
            class="text-portfolio-text/80 hover:text-portfolio-heading transition-all duration-300 flex-shrink-0"
            >Início</a
          >
          <a
            href="#projects"
            class="text-portfolio-text/80 hover:text-portfolio-heading transition-all duration-300 flex-shrink-0"
            >Projetos</a
          >
          <a
            href="#about"
            class="text-portfolio-text/80 hover:text-portfolio-heading transition-all duration-300 flex-shrink-0"
            >Sobre</a
          >

          <mat-button-toggle-group
            class="theme-toggle-group"
            [value]="themeService.currentTheme()"
            (change)="onThemeChange($event.value)"
            aria-label="Escolha de tema"
          >
            <mat-button-toggle value="light" aria-label="Tema claro" matTooltip="Tema claro">
              <mat-icon>light_mode</mat-icon>
            </mat-button-toggle>
            <mat-button-toggle value="dark" aria-label="Tema escuro" matTooltip="Tema escuro">
              <mat-icon>dark_mode</mat-icon>
            </mat-button-toggle>
          </mat-button-toggle-group>
        </div>
      </nav>
    </header>

    <main class="flex-grow">
      <router-outlet></router-outlet>
    </main>

    <footer
      class="border-t border-portfolio-border/20 bg-portfolio-card/10 backdrop-blur-md transition-colors duration-500 [transform:translateZ(0)] [will-change:transform]"
    >
      <div
        class="max-w-6xl mx-auto px-4 sm:px-8 py-8 flex flex-col md:flex-row items-center justify-between gap-4"
      >
        <p class="text-sm text-portfolio-text/70">© 2026 Alexsandro Moraes</p>
        <div class="flex items-center gap-5 text-sm">
          <a
            href="https://github.com/lexmoraes"
            target="_blank"
            rel="noopener noreferrer"
            class="text-portfolio-text/70 hover:text-portfolio-primary transition-colors"
            >GitHub</a
          >
          <a
            href="https://www.linkedin.com/in/lexmoraes"
            target="_blank"
            rel="noopener noreferrer"
            class="text-portfolio-text/70 hover:text-portfolio-primary transition-colors"
            >LinkedIn</a
          >
        </div>
      </div>
    </footer>
  </div>
</div>
